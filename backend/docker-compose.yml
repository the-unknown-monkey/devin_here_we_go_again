# Local Postgres only. Ports are bound to 127.0.0.1 — never expose the DB
# through ngrok or any public interface (TRD §4/§6).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hwga
      POSTGRES_PASSWORD: hwga
      POSTGRES_DB: hwga
    ports:
      - "127.0.0.1:55532:5432"
    volumes:
      - hwga-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hwga -d hwga"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Disposable test database (D17). tmpfs-backed: data vanishes with the
  # container, which is the point — tests never touch dev data.
  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hwga
      POSTGRES_PASSWORD: hwga
      POSTGRES_DB: hwga_test
    ports:
      - "127.0.0.1:55533:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hwga -d hwga_test"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  hwga-pgdata:
