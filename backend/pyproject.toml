[project]
name = "hwga-backend"
version = "0.1.0"
description = "Here We Go Again — FastAPI backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.5,<3",
    "apscheduler>=3.10,<4",
    "python-multipart>=0.0.20,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "httpx2>=2.16.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
